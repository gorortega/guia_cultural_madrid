<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía Cultural de Madrid</title>
<style>
:root{
  --bg:#18212b;
  --panel:#202c38;
  --panel2:#263442;
  --text:#eef3f7;
  --muted:#b9c5cf;
  --line:#40505e;
  --accent:#9fc5e8;

  --museos-bg:#3b3038; --museos-line:#d7a9ba; --museos-tag:#efd5df; --museos-text:#513746;
  --patrimonio-bg:#3d392c; --patrimonio-line:#dbc88f; --patrimonio-tag:#f2e8bd; --patrimonio-text:#514829;
  --teatros-bg:#363143; --teatros-line:#c7b1dc; --teatros-tag:#e5d8f0; --teatros-text:#4b3c5a;
  --cines-bg:#2b3943; --cines-line:#9fc7df; --cines-tag:#d6e9f3; --cines-text:#365466;
  --espacios-bg:#2e3d36; --espacios-line:#a9cfbd; --espacios-tag:#d9ede3; --espacios-text:#365547;
  --rutas-bg:#40313b; --rutas-line:#d6adc4; --rutas-tag:#eed9e5; --rutas-text:#573e4d;

  --agenda-bg:#293746;
  --agenda-line:#7fa9ce;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:60px}
button,input,textarea,select{font:inherit}
header{background:#202c38;padding:24px 18px;text-align:center;border-bottom:3px solid #8fb8da}
header h1{font-size:1.8rem;margin-bottom:7px}
header p{color:var(--muted);font-size:.95rem;max-width:760px;margin:auto}
.container{max-width:1250px;margin:auto;padding:18px 15px}
.controls{background:var(--panel);padding:18px;border-radius:13px;border:1px solid var(--line);margin-bottom:20px;display:flex;flex-direction:column;gap:13px}
.search-box input{width:100%;padding:12px 14px;background:#17222d;color:var(--text);border:1px solid var(--line);border-radius:9px;outline:none}
.filter-buttons{display:flex;flex-wrap:wrap;gap:8px}
.btn-filter,.tab-btn{border:1px solid var(--line);background:#273440;color:#dbe5ec;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:650}
.btn-filter:hover,.tab-btn:hover{background:#314250}
.btn-filter.active,.tab-btn.active{background:#789bb9;color:#fff;border-color:#9fc5e8}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tab-btn{border:none;border-bottom:3px solid transparent;border-radius:7px 7px 0 0}
#tabVistos{color:#a9cfbd}
#tabAgenda{color:#a9c8e3;font-weight:800}
.results-count{font-size:.92rem;color:var(--muted);margin:8px 0 14px;font-weight:650}
.section-title{font-size:1.35rem;margin:28px 0 13px;padding:9px 12px;border-radius:9px;border-left:6px solid currentColor;background:rgba(255,255,255,.035)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(315px,1fr));gap:18px;margin-bottom:25px;align-items:stretch}
.card{border-radius:12px;border:1px solid;display:flex;flex-direction:column;height:100%;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.card.museos{background:var(--museos-bg);border-color:var(--museos-line)}
.card.patrimonio{background:var(--patrimonio-bg);border-color:var(--patrimonio-line)}
.card.teatros{background:var(--teatros-bg);border-color:var(--teatros-line)}
.card.cines{background:var(--cines-bg);border-color:var(--cines-line)}
.card.espacios{background:var(--espacios-bg);border-color:var(--espacios-line)}
.card.rutas{background:var(--rutas-bg);border-color:var(--rutas-line)}
.card.visited{background:#2a343d!important;border-color:#6a7884!important;filter:grayscale(.75);opacity:.82}
.card-img-container{height:175px;background:#17222d;position:relative;overflow:hidden;flex-shrink:0}
.card-img{width:100%;height:100%;object-fit:cover;display:block}
.card-img.loading{opacity:.35}
.image-credit{position:absolute;left:7px;bottom:6px;background:rgba(0,0,0,.62);color:#e8edf1;padding:3px 6px;border-radius:4px;font-size:.67rem}
.image-credit a{color:#d9e9f5;text-decoration:none}
.card-header{padding:13px 15px;display:flex;justify-content:space-between;align-items:flex-start;gap:9px;background:rgba(0,0,0,.12);min-height:62px;flex-shrink:0}
.card-title{font-size:1.08rem;font-weight:750;line-height:1.28}
.card-title a{color:#fff;text-decoration:none}
.card-title a:hover{text-decoration:underline}
.badge{font-size:.72rem;font-weight:800;padding:4px 7px;border-radius:6px;white-space:nowrap}
.museos .badge{background:var(--museos-tag);color:var(--museos-text)}
.patrimonio .badge{background:var(--patrimonio-tag);color:var(--patrimonio-text)}
.teatros .badge{background:var(--teatros-tag);color:var(--teatros-text)}
.cines .badge{background:var(--cines-tag);color:var(--cines-text)}
.espacios .badge{background:var(--espacios-tag);color:var(--espacios-text)}
.rutas .badge{background:var(--rutas-tag);color:var(--rutas-text)}

.card-body{padding:14px 15px;flex-grow:1;display:flex;flex-direction:column;gap:9px;font-size:.9rem}
.info-row{display:flex;gap:7px}
.info-label{font-weight:700;min-width:88px;color:#edf2f5}
.info-value{color:#d1dbe2}
.phone-link{color:#acd0ed;text-decoration:none;font-weight:650}

.notes{font-size:.86rem;color:#e2e8ec;border-top:1px solid rgba(255,255,255,.10);padding-top:9px;max-height:110px;overflow-y:auto}

.user-notes-preview{font-size:.85rem;color:#d2e6f5;background:rgba(0,0,0,.25);border-left:3px solid #78a6ca;padding:8px 10px;border-radius:5px;margin-top:6px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.user-notes-preview a{color:#9fc5e8;text-decoration:underline}

.price-box{background:rgba(0,0,0,.16);padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.07)}
.price-row{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;margin-bottom:3px}
.price-row:last-child{margin-bottom:0}
.price-row strong{color:#fff}
.darde{color:#b7d6ee!important}
.free-info{font-size:.8rem;color:#cbd6de}

.card-footer{padding:11px 14px;background:rgba(0,0,0,.14);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:auto}
.btn-action{border:0;border-radius:7px;padding:8px 10px;cursor:pointer;font-weight:750;font-size:.85rem}
.btn-schedule{background:#78a6ca;color:#fff}
.btn-schedule:hover{background:#8bb5d6}
.btn-scheduled{background:#5a6874;color:#dce5eb}
.btn-scheduled:hover{background:#6c7b89}
.btn-edit-schedule{background:#4b6584;color:#fff;padding:8px 9px}
.btn-edit-schedule:hover{background:#59799e}
.btn-user-notes{background:#3b5266;color:#e3edf5;border:1px solid #5a738a}
.btn-user-notes:hover{background:#4a657d}
.btn-user-notes.has-notes{background:#2e5040;color:#85e3b3;border-color:#4e8a6a}
.btn-visit{background:#5f8c76;color:#fff}
.btn-visit:hover{background:#6da085}
.btn-delete{background:#b96d72;color:#fff;border:0;padding:8px 11px;border-radius:7px;cursor:pointer;font-weight:750}
.btn-gcal{background:#5f8fc0;color:#fff;text-decoration:none;padding:8px 11px;border-radius:7px;font-size:.83rem;font-weight:750}

.empty{padding:40px;text-align:center;color:#aebbc5}

.agenda-shell{background:var(--agenda-bg);border:1px solid var(--agenda-line);border-radius:13px;padding:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.agenda-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.agenda-title{font-size:1.35rem;font-weight:800}
.agenda-nav{display:flex;gap:6px;flex-wrap:wrap}
.agenda-nav button{border:1px solid #59748c;background:#33485b;color:#edf3f7;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:700}
.agenda-nav button:hover{background:#40586d}
.agenda-view-buttons{display:flex;gap:5px}
.agenda-view-buttons button.active{background:#7699b6;border-color:#9fc5e8}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid #465c6e;border-top:1px solid #465c6e}
.weekday{padding:8px 5px;text-align:center;background:#34495b;border-right:1px solid #465c6e;border-bottom:1px solid #465c6e;font-size:.78rem;font-weight:800;color:#dbe5eb}
.day-cell{min-height:105px;padding:6px;background:#253645;border-right:1px solid #465c6e;border-bottom:1px solid #465c6e;vertical-align:top}
.day-cell.other-month{background:#202d38;color:#6f7e89}
.day-number{font-size:.78rem;font-weight:800;color:#dce5ea;margin-bottom:4px}
.day-cell.today .day-number{display:inline-block;background:#7b9ebd;color:#fff;border-radius:50%;width:25px;height:25px;text-align:center;line-height:25px}
.event-chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid #9fc5e8;background:#31485a;color:#edf3f7;border-radius:5px;padding:4px 5px;margin:4px 0;cursor:pointer;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-chip:hover{background:#3d566b}
.event-time{font-weight:800;color:#bdd7eb}
.week-view{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid #465c6e;border-top:1px solid #465c6e}
.week-day{min-height:360px;background:#253645;border-right:1px solid #465c6e;border-bottom:1px solid #465c6e;padding:7px}
.week-day-head{font-weight:800;font-size:.82rem;padding-bottom:7px;border-bottom:1px solid #465c6e}
.day-view{background:#253645;border:1px solid #465c6e;padding:12px;min-height:300px}
.day-event{border-left:5px solid #9fc5e8;background:#31485a;padding:10px;border-radius:7px;margin:8px 0}
.day-event h4{font-size:.98rem;margin-bottom:3px}
.day-event p{font-size:.83rem;color:#c9d6df}
.agenda-event-list{margin-top:15px}
.agenda-event-list summary{cursor:pointer;color:#bdd7eb;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;justify-content:center;align-items:center;z-index:1000;padding:15px}
.modal{background:#263541;border:1px solid #597083;border-radius:12px;padding:21px;width:100%;max-width:480px;color:#fff}
.modal h3{margin-bottom:15px;color:#b8d2e8}
.form-group{margin-bottom:13px}
.form-group label{display:block;margin-bottom:5px;font-size:.88rem;color:#d0dbe2}
.form-group input,.form-group textarea{width:100%;padding:10px;background:#1b2731;border:1px solid #536574;border-radius:7px;color:#fff}
.form-group textarea{height:160px;resize:vertical;line-height:1.4}
.modal-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* ESTILOS ESPECÍFICOS CUADERNO MOLESKINE FOLIO A4 */
.moleskine-container{max-width:850px;margin:0 auto;background:#202c38;border-radius:12px;padding:18px;border:1px solid #3f5162}
.moleskine-toolbar{background:#18212b;padding:12px;border-radius:8px;border:1px solid #3f5162;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.moleskine-tool-btn{padding:7px 11px;border-radius:6px;border:1px solid #3f5162;background:#263442;color:#fff;cursor:pointer;font-weight:bold;font-size:0.82rem}
.moleskine-tool-btn.active{background:var(--accent);color:#000;border-color:#fff}
.folio-wrapper{background:#fcfbf7;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.4);overflow-y:auto;max-height:800px;border:1px solid #dcd6cd;position:relative}
#moleskineCanvas{display:block;margin:0 auto;background:#fcfbf7;touch-action:none;cursor:crosshair}
.saved-notes-list{margin-top:20px;background:#18212b;padding:14px;border-radius:8px;border:1px solid #3f5162}
.saved-note-card{background:#263442;padding:10px 14px;border-radius:6px;border:1px solid #3f5162;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}

@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .calendar,.week-view{font-size:.7rem}
  .day-cell{min-height:82px;padding:4px}
  .week-day{min-height:280px;padding:5px}
  .event-chip{font-size:.66rem}
}
</style>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDou7KTSwF9hW1GRttLAso-2erfwl3TMDM",
    authDomain: "guia-cultural-madrid.firebaseapp.com",
    databaseURL: "https://guia-cultural-madrid-default-rtdb.firebaseio.com",
    projectId: "guia-cultural-madrid",
    storageBucket: "guia-cultural-madrid.firebasestorage.app",
    messagingSenderId: "808999046922",
    appId: "1:808999046922:web:31fa751dcf1a500103b4f3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.saveToFirebase = function(path, data) {
    set(ref(db, path), data);
  };

  onValue(ref(db, 'visited_cultural_madrid'), (snapshot) => {
    const val = snapshot.val();
    window.visitedItems = val ? val : [];
    localStorage.setItem("visited_cultural_madrid", JSON.stringify(window.visitedItems));
    if (typeof renderContent === "function") renderContent();
  });

  onValue(ref(db, 'scheduled_events_madrid'), (snapshot) => {
    const val = snapshot.val();
    window.scheduledEvents = val ? val : [];
    localStorage.setItem("scheduled_events_madrid", JSON.stringify(window.scheduledEvents));
    if (typeof renderContent === "function") renderContent();
  });

  onValue(ref(db, 'user_place_notes_madrid'), (snapshot) => {
    const val = snapshot.val();
    window.userNotes = val ? val : {};
    localStorage.setItem("user_place_notes_madrid", JSON.stringify(window.userNotes));
    if (typeof renderContent === "function") renderContent();
  });

  onValue(ref(db, 'moleskine_saved_notes'), (snapshot) => {
    const val = snapshot.val();
    window.moleskineLibrary = val ? val : [];
    localStorage.setItem("moleskine_saved_notes", JSON.stringify(window.moleskineLibrary));
    if (typeof renderMoleskineLibrary === "function") renderMoleskineLibrary();
  });
</script>
</head>
<body>

<header>
  <h1>Guía Cultural de Madrid</h1>
  <p>Directorio de accesos gratuitos, tarifas reducidas con DARDE y agenda personal de eventos.</p>
</header>

<div class="container">
  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar lugar, dirección o tipo de espacio (ej. Prado, Sorolla, Zarzuela)...">
    </div>
    <div class="filter-buttons">
      <button class="btn-filter active" onclick="setConditionFilter('all')">Todos los tipos de tarifa</button>
      <button class="btn-filter" onclick="setConditionFilter('gratis-darde')">100% Gratis con DARDE</button>
      <button class="btn-filter" onclick="setConditionFilter('descuento-darde')">Descuento DARDE</button>
      <button class="btn-filter" onclick="setConditionFilter('gratis-todos')">Gratis Público General</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setCategoryTab('all')">Ver Todo</button>
    <button class="tab-btn" onclick="setCategoryTab('museos')">Museos y Galerías</button>
    <button class="tab-btn" onclick="setCategoryTab('patrimonio')">Palacios, Monasterios e Iglesias</button>
    <button class="tab-btn" onclick="setCategoryTab('teatros')">Teatros y Música</button>
    <button class="tab-btn" onclick="setCategoryTab('cines')">Cines y Salas</button>
    <button class="tab-btn" onclick="setCategoryTab('espacios')">Jardines y Centros</button>
    <button class="tab-btn" onclick="setCategoryTab('rutas')">Rutas Guiadas</button>
    <button class="tab-btn" id="tabVistos" onclick="setCategoryTab('vistos')">✓ Vistos</button>
    <button class="tab-btn" id="tabAgenda" onclick="setCategoryTab('agenda')">📅 Agenda Eventos</button>
    <button class="tab-btn" onclick="switchTab('moleskine')">📓 Notas Moleskine</button>
  </div>

  <div class="results-count" id="resultsCount">Cargando espacios...</div>
  <div id="contentArea"></div>
</div>

<!-- SECCIÓN NOTAS MOLESKINE FOLIO A4 -->
<div id="moleskineSection" style="display:none;" class="moleskine-container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2 style="color:var(--accent); font-family:serif; margin:0;">📓 Cuaderno Moleskine</h2>
    <button onclick="exitMoleskine()" style="background:#ef4444; color:white; border:none; padding:8px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">← Volver a la guía</button>
  </div>

  <div style="margin-bottom:12px; display:flex; gap:10px;">
    <input type="text" id="moleskineTitleInput" placeholder="Título de la nota (ej. Estación de Atocha - Nota 1)..." style="flex:1; padding:8px 12px; border-radius:6px; border:1px solid #3f5162; background:#18212b; color:#fff;">
    <select id="moleskinePlaceSelect" style="padding:8px; border-radius:6px; border:1px solid #3f5162; background:#18212b; color:#fff;">
      <option value="">-- Vincular a un lugar (opcional) --</option>
    </select>
  </div>

  <!-- Barra de Herramientas -->
  <div class="moleskine-toolbar">
    <button onclick="setTool('pen')" id="tool-pen" class="moleskine-tool-btn active">🖊️ Bolígrafo</button>
    <button onclick="setTool('marker')" id="tool-marker" class="moleskine-tool-btn">🖊️ Rotulador</button>
    <button onclick="setTool('pencil')" id="tool-pencil" class="moleskine-tool-btn">✏️ Lápiz / Carboncillo</button>
    <button onclick="setTool('watercolor')" id="tool-watercolor" class="moleskine-tool-btn">🎨 Acuarela</button>
    <button onclick="setTool('highlighter')" id="tool-highlighter" class="moleskine-tool-btn">🖍️ Fluorescente</button>
    <button onclick="setTool('eraser')" id="tool-eraser" class="moleskine-tool-btn">🧹 Goma</button>
    <button onclick="undoLastStroke()" class="moleskine-tool-btn" style="background:#4b5563;">↩️ Deshacer</button>

    <div style="display:flex; gap:5px; align-items:center; margin-left:5px;">
      <input type="color" id="moleskineColorPicker" value="#000000" onchange="customColor(this.value)" style="width:28px; height:28px; border:none; cursor:pointer; background:none;">
      <button onclick="setColor('#000000')" style="background:#000000; width:22px; height:22px; border-radius:50%; border:1px solid #fff;"></button>
      <button onclick="setColor('#2563eb')" style="background:#2563eb; width:22px; height:22px; border-radius:50%; border:1px solid #fff;"></button>
      <button onclick="setColor('#dc2626')" style="background:#dc2626; width:22px; height:22px; border-radius:50%; border:1px solid #fff;"></button>
      <button onclick="setColor('#f59e0b')" style="background:#f59e0b; width:22px; height:22px; border-radius:50%; border:1px solid #fff;"></button>
      <button onclick="setColor('#10b981')" style="background:#10b981; width:22px; height:22px; border-radius:50%; border:1px solid #fff;"></button>
    </div>

    <select id="moleskineSize" onchange="setSize(this.value)" style="padding:5px; border-radius:4px; background:#263442; color:#fff; border:1px solid #3f5162;">
      <option value="2">Grosor Fino</option>
      <option value="6" selected>Grosor Medio</option>
      <option value="16">Grosor Ancho</option>
      <option value="30">Grosor Lavado / Grande</option>
    </select>

    <label style="background:#2563eb; color:white; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:0.82rem;">
      📷 Foto + GPS
      <input type="file" accept="image/*" capture="environment" onchange="handleFotoGPS(event)" style="display:none;">
    </label>
    
    <button onclick="clearCanvas()" class="moleskine-tool-btn" style="background:#ef4444;">🗑️ Limpiar</button>
  </div>

  <!-- Redimensionar Foto Insertada -->
  <div id="photoControls" style="display:none; background:#18212b; padding:8px; border-radius:6px; margin-bottom:10px; align-items:center; gap:10px; border:1px solid #3f5162;">
    <span style="font-size:0.8rem;">Escala de foto insertada:</span>
    <input type="range" id="photoScale" min="0.2" max="1.0" step="0.05" value="0.7" oninput="updatePhotoScale(this.value)">
    <button onclick="confirmPhotoPlacement()" style="background:#10b981; border:none; color:#fff; padding:4px 10px; border-radius:4px; font-weight:bold; cursor:pointer;">Fijar Foto</button>
  </div>

  <!-- Lienzo Folio DIN A4 con Scroll -->
  <div class="folio-wrapper">
    <canvas id="moleskineCanvas" width="794" height="1123"></canvas>
  </div>

  <div style="margin-top:12px; display:flex; gap:10px; align-items:center;">
    <button onclick="saveMoleskineNote()" style="flex:1; background:#10b981; color:#fff; font-weight:bold; padding:10px; border-radius:6px; border:none; cursor:pointer; font-size:0.95rem;">💾 Guardar Nota en Biblioteca</button>
    <button id="btnCalendar" onclick="exportToCalendar()" style="display:none; background:#8b5cf6; color:#fff; font-weight:bold; padding:10px; border-radius:6px; border:none; cursor:pointer; font-size:0.9rem;">📅 Añadir a Google Calendar</button>
  </div>
  <div id="gpsStatus" style="font-size:12px; color:var(--muted); font-style:italic; margin-top:5px;"></div>

  <!-- Galería / Historial de Notas Guardadas -->
  <div class="saved-notes-list">
    <h3 style="color:var(--accent); margin-bottom:10px; font-size:1.1rem;">📚 Biblioteca de Notas Moleskine Guardadas</h3>
    <div id="savedNotesContainer"></div>
  </div>

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function parseMarkdownLinks(text){
  const safe = escapeHtml(text);
  return safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function normalize(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

  } else {

}

function saveEvent(){
  const customTitle = document.getElementById("eventTitle").value.trim();
  const rawName = selectedPlaceForModal.nombre;
  
  let prefix = "Visita a";
  const lowerName = rawName.toLowerCase();
  if(lowerName.startsWith("museo") || lowerName.startsWith("palacio") || lowerName.startsWith("monasterio") || lowerName.startsWith("panteón") || lowerName.startsWith("teatro") || lowerName.startsWith("auditorio") || lowerName.startsWith("cine") || lowerName.startsWith("círculo") || lowerName.startsWith("centro") || lowerName.startsWith("tren")){
    prefix = "Visita al";
  } else if(lowerName.startsWith("catedral") || lowerName.startsWith("iglesia") || lowerName.startsWith("ermita") || lowerName.startsWith("sala") || lowerName.startsWith("estación")){
    prefix = "Visita a la";
  }

  const title = customTitle ? `${prefix} ${customTitle}` : `${prefix} ${rawName}`;
  const date = document.getElementById("eventDate").value;
  const time = document.getElementById("eventTime").value || "18:00";
  if(!date)return alert("Por favor selecciona una fecha");

  let savedEvId = null;
  if(editingEventId){
    const idx = window.scheduledEvents.findIndex(e => e.id === editingEventId);
    if(idx !== -1){
      window.scheduledEvents[idx].title = title;
      window.scheduledEvents[idx].date = date;
      window.scheduledEvents[idx].time = time;
      savedEvId = window.scheduledEvents[idx].id;
    }
  } else {
    const ev={
      id:"ev_"+Date.now(),
      placeId:selectedPlaceForModal.id,
      placeName:selectedPlaceForModal.nombre,
      address:selectedPlaceForModal.direccion,
      phone:selectedPlaceForModal.telefono || "",
      notes:selectedPlaceForModal.notes || "",
      title,date,time
    };
    window.scheduledEvents.push(ev);
    savedEvId = ev.id;
  }

  window.scheduledEvents.sort((a,b)=>new Date(a.date+"T"+a.time)-new Date(b.date+"T"+b.time));
  localStorage.setItem("scheduled_events_madrid", JSON.stringify(window.scheduledEvents));
  if(window.saveToFirebase) window.saveToFirebase('scheduled_events_madrid', window.scheduledEvents);
  closeModal();

  const [y, m, d] = date.split("-").map(Number);
  agendaCursor = new Date(y, m - 1, 1);
  agendaView = "month";
  setCategoryTab("agenda");
}

function setConditionFilter(condition){
  currentCondition=condition;
  document.querySelectorAll(".btn-filter").forEach(b=>b.classList.remove("active"));
  [...document.querySelectorAll(".btn-filter")].find(b=>b.getAttribute("onclick")===`setConditionFilter('${condition}')`)?.classList.add("active");
  if(currentCategory==="agenda")currentCategory="all";
  renderContent();
}

function setCategoryTab(category){
  currentCategory=category;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  const map={all:0,museos:1,patrimonio:2,teatros:3,cines:4,espacios:5,rutas:6,vistos:7,agenda:8};
  const btn=document.querySelectorAll(".tab-btn")[map[category]];
  if(btn)btn.classList.add("active");
  renderContent();
}

document.getElementById("searchInput").addEventListener("input",e=>{searchQuery=e.target.value;renderContent()});

async function loadCommonsImage(item,img,credit){
  const cached=imageCache[item.id];
  if(cached){
    applyCommonsResult(item,img,credit,cached);
    return;
  }
  img.classList.add("loading");
  try{
    const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(item.imagenQuery)+"&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1000&format=json&origin=*";
    const res=await fetch(url);
    const json=await res.json();
    const pages=json.query?.pages||{};
    const page=Object.values(pages)[0];
    const info=page?.imageinfo?.[0];
    if(!info?.thumburl && !info?.url)throw new Error("Sin imagen");
    const result={
      url:info.thumburl||info.url,
      source:"https://commons.wikimedia.org/wiki/"+encodeURIComponent(page.title.replace(/^File:/,"File:")).replace(/%2F/g,"/"),
      title:page.title.replace(/^File:/,""),
      author:info.extmetadata?.Artist?.value||"",
      license:info.extmetadata?.LicenseShortName?.value||""
    };
    imageCache[item.id]=result;
    localStorage.setItem("commons_image_cache_madrid",JSON.stringify(imageCache));
    applyCommonsResult(item,img,credit,result);
  }catch(err){
    img.classList.remove("loading");
    img.removeAttribute("src");
    img.alt=`Imagen no disponible`;
  }
}

function applyCommonsResult(item,img,credit,result){
  img.src=result.url;
  img.alt=item.nombre;
  img.classList.remove("loading");
  credit.innerHTML=`<a href="${result.source}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>`;
}

function renderCards(filtered){
  const contentArea = document.getElementById("contentArea");
  if(!filtered.length){
    contentArea.innerHTML = `<div class="empty">No se encontraron resultados.</div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(item => (grouped[item.categoria] ??= []).push(item));
  let html = "";
  Object.keys(grouped).forEach(catKey => {
    const cat = categories[catKey];
    if (cat) {
      html += `<section><h2 class="section-title" style="color:${cat.color}">${cat.title}</h2><div class="grid">`;
      grouped[catKey].forEach(item => {
        const isVisited = window.visitedItems.includes(item.id);
        const scheduledEvent = window.scheduledEvents.find(e=>e.placeId===item.id);
        const isScheduled = !!scheduledEvent;
        const telClean = item.telefono.replace(/\s/g,"");
        const hasMyNotes = !!window.userNotes[item.id];

        let scheduleButtonHtml = `<button class="btn-action btn-schedule" onclick="openModal('${item.id}')">📅 Agendar</button>`;
        if(isScheduled){
          scheduleButtonHtml = `<button class="btn-action btn-scheduled">✓ Agendado</button>`;
        }

        const notesButtonHtml = `<button class="btn-action btn-user-notes ${hasMyNotes?'has-notes':''}" onclick="openUserNotesModal('${item.id}')">${hasMyNotes ? '📝 Notas ✓' : '📝 Notas'}</button>`;

        html += `
          <article class="card ${item.categoria} ${isVisited?"visited":""}" id="card-${item.id}">
            <div class="card-img-container">
              <a href="${item.web}" target="_blank" rel="noopener noreferrer">
                <img id="img-${item.id}" class="card-img loading" alt="${escapeHtml(item.nombre)}">
              </a>
              <div class="image-credit" id="credit-${item.id}">Wikimedia Commons...</div>
            </div>
            <div class="card-header">
              <div class="card-title"><a href="${item.web}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.nombre)}</a></div>
              <span class="badge">${escapeHtml(item.badgeText)}</span>
            </div>
            <div class="card-body">
              <div class="info-row"><span class="info-label">Dirección:</span><span class="info-value">${escapeHtml(item.direccion)}</span></div>
              <div class="info-row"><span class="info-label">Teléfono:</span><span class="info-value"><a href="tel:${telClean}" class="phone-link">${escapeHtml(item.telefono)}</a></span></div>
              <div class="price-box">
                <div class="price-row"><span>Precio General:</span><strong>${escapeHtml(item.precioGeneral)}</strong></div>
                <div class="price-row"><span>Con DARDE:</span><strong class="darde">${escapeHtml(item.precioDARDE)}</strong></div>
              </div>
              <div class="notes">${escapeHtml(item.notas)}</div>
            </div>
            <div class="card-footer">
              <div style="display:flex;gap:4px;">
                ${scheduleButtonHtml}
                ${notesButtonHtml}
              </div>
              <button class="btn-action btn-visit" onclick="toggleVisit('${item.id}')">${isVisited?"✓ Visitado":"Marcar visto"}</button>
            </div>
          </article>`;
      });
      html += `</div></section>`;
    }
  });

  contentArea.innerHTML = html;
  filtered.forEach(item=>loadCommonsImage(item,document.getElementById(`img-${item.id}`),document.getElementById(`credit-${item.id}`)));
}

function renderContent(){
  document.getElementById("tabVistos").innerText=`✓ Vistos (${window.visitedItems.length})`;
  document.getElementById("tabAgenda").innerText=`📅 Agenda Eventos (${window.scheduledEvents.length})`;
  const q=normalize(searchQuery);
  const filtered=data.filter(item=>{
    const isVisited=window.visitedItems.includes(item.id);
    const matchCategory=currentCategory==="all"||currentCategory===item.categoria||(currentCategory==="vistos"&&isVisited);
    const matchCondition=currentCondition==="all"||currentCondition===item.condicion;
    const hay=normalize([item.nombre,item.direccion,item.telefono,item.notas].join(" "));
    return matchCategory&&matchCondition&&hay.includes(q);
  });
  document.getElementById("resultsCount").innerText=`Mostrando ${filtered.length} espacio(s) disponible(s)`;
  renderCards(filtered);
}

renderContent();

/* ---------- ARQUITECTURA MOLESKINE FOLIO A4 CON HERRAMIENTAS REALES Y GUARDADO ---------- */
let canvas = document.getElementById("moleskineCanvas");
let ctx = canvas ? canvas.getContext("2d") : null;
let isDrawing = false;
let currentTool = "pen";
let currentColor = "#000000";
let currentSize = 6;
let currentCoords = null;

let undoStack = [];
let maxUndo = 20;

let pendingImage = null;
let pendingImgPos = { x: 50, y: 100, width: 300, height: 200 };
let currentPhotoScale = 0.7;
let maxYWritten = 50;

function initMoleskineSelect() {
  const select = document.getElementById("moleskinePlaceSelect");
  if(!select || select.options.length > 1) return;
  data.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.nombre;
    select.appendChild(opt);
  });
}

function saveCanvasState() {
  if(!ctx) return;
  if(undoStack.length >= maxUndo) undoStack.shift();
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}

function undoLastStroke() {
  if(!ctx || undoStack.length === 0) return;
  const previousState = undoStack.pop();
  ctx.putImageData(previousState, 0, 0);
}

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll(".moleskine-tool-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById(`tool-${tool}`);
  if(btn) btn.classList.add("active");
  
  if(tool === 'pen') {
    currentColor = "#000000";
    currentSize = 4;
  } else if(tool === 'marker') {
    currentColor = "#1e293b";
    currentSize = 8;
  } else if(tool === 'pencil') {
    currentColor = "#334155";
    currentSize = 3;
  } else if(tool === 'watercolor') {
    currentColor = "#3b82f6";
    currentSize = 16;
  } else if(tool === 'highlighter') {
    currentColor = "#fef08a";
    currentSize = 24;
  } else if(tool === 'eraser') {
    currentSize = 20;
  }
  document.getElementById("moleskineSize").value = currentSize;
}

function setColor(color) {
  currentColor = color;
  document.getElementById("moleskineColorPicker").value = color;
}

function customColor(color) {
  currentColor = color;
}

function setSize(size) {
  currentSize = parseFloat(size);
}

if(canvas) {
  canvas.addEventListener("pointerdown", startDrawing);
  canvas.addEventListener("pointermove", draw);
  canvas.addEventListener("pointerup", stopDrawing);
  canvas.addEventListener("pointerleave", stopDrawing);
}

function startDrawing(e) {
  if(!ctx) return;
  saveCanvasState();
  isDrawing = true;
  ctx.beginPath();
  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  const x = (clientX - rect.left) * (canvas.width / rect.width);
  const y = (clientY - rect.top) * (canvas.height / rect.height);
  
  if(y > maxYWritten) maxYWritten = y;
  ctx.moveTo(x, y);
}

function draw(e) {
  if(!isDrawing || !ctx) return;
  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  const x = (clientX - rect.left) * (canvas.width / rect.width);
  const y = (clientY - rect.top) * (canvas.height / rect.height);

  if(y > maxYWritten) maxYWritten = y;

  ctx.lineWidth = currentSize;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.shadowBlur = 0;

  if(currentTool === 'pen') {
    ctx.globalAlpha = 1.0;
    ctx.strokeStyle = currentColor;
  } else if(currentTool === 'marker') {
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = currentColor;
  } else if(currentTool === 'pencil') {
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = currentColor;
  } else if(currentTool === 'watercolor') {
    ctx.globalAlpha = 0.18;
    ctx.shadowBlur = 4;
    ctx.shadowColor = currentColor;
    ctx.strokeStyle = currentColor;
  } else if(currentTool === 'highlighter') {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = currentColor;
  } else if(currentTool === 'eraser') {
    ctx.globalAlpha = 1.0;
    ctx.strokeStyle = "#fcfbf7";
  }

  ctx.lineTo(x, y);
  ctx.stroke();
}

function stopDrawing() {
  if(!isDrawing) return;
  isDrawing = false;
  if(ctx) {
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;
  }
}

function clearCanvas() {
  if(!ctx || !canvas) return;
  saveCanvasState();
  ctx.fillStyle = "#fcfbf7";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Dibujar pauta tenue de cuaderno de notas
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;
  for(let y = 40; y < canvas.height; y += 28) {
    ctx.beginPath();
    ctx.moveTo(30, y);
    ctx.lineTo(canvas.width - 30, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;
  maxYWritten = 50;
}

function handleFotoGPS(event) {
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      pendingImage = img;
      const targetWidth = canvas.width * 0.7;
      const aspect = img.height / img.width;
      const targetHeight = targetWidth * aspect;
      const targetY = Math.min(maxYWritten + 30, canvas.height - targetHeight - 20);

      pendingImgPos = { x: (canvas.width - targetWidth) / 2, y: targetY, width: targetWidth, height: targetHeight };
      document.getElementById("photoControls").style.display = "flex";
      renderPendingImage();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);

  if (navigator.geolocation) {
    document.getElementById("gpsStatus").innerText = "Obteniendo ubicación GPS...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById("gpsStatus").innerText = `📍 Coordenadas guardadas: ${currentCoords.lat.toFixed(5)}, ${currentCoords.lng.toFixed(5)}`;
        document.getElementById("btnCalendar").style.display = "block";
      },
      () => { document.getElementById("gpsStatus").innerText = "📍 GPS no disponible."; }
    );
  }
}

function renderPendingImage() {
  if(!pendingImage || !ctx) return;
  saveCanvasState();
  ctx.drawImage(pendingImage, pendingImgPos.x, pendingImgPos.y, pendingImgPos.width, pendingImgPos.height);
}

function updatePhotoScale(scaleVal) {
  if(!pendingImage) return;
  undoLastStroke();
  currentPhotoScale = parseFloat(scaleVal);
  const targetWidth = canvas.width * currentPhotoScale;
  const aspect = pendingImage.height / pendingImage.width;
  const targetHeight = targetWidth * aspect;
  
  pendingImgPos.width = targetWidth;
  pendingImgPos.height = targetHeight;
  pendingImgPos.x = (canvas.width - targetWidth) / 2;
  renderPendingImage();
}

function confirmPhotoPlacement() {
  document.getElementById("photoControls").style.display = "none";
  maxYWritten = pendingImgPos.y + pendingImgPos.height + 20;
  pendingImage = null;
}

function switchTab(tab) {
  if(tab === 'moleskine') {
    document.getElementById("contentArea").style.display = "none";
    const resCount = document.getElementById("resultsCount");
    if(resCount) resCount.style.display = "none";
    
    document.getElementById("moleskineSection").style.display = "block";
    initMoleskineSelect();
    if(undoStack.length === 0) clearCanvas();
    renderMoleskineLibrary();
  }
}

function exitMoleskine() {
  document.getElementById("moleskineSection").style.display = "none";
  document.getElementById("contentArea").style.display = "block";
  const resCount = document.getElementById("resultsCount");
  if(resCount) resCount.style.display = "block";
}

function saveMoleskineNote() {
  const title = document.getElementById("moleskineTitleInput").value.trim() || `Nota Moleskine ${new Date().toLocaleDateString()}`;
  const placeId = document.getElementById("moleskinePlaceSelect").value;
  const dataUrl = canvas.toDataURL("image/png");

  const noteEntry = {
    id: "moleskine_" + Date.now(),
    title,
    placeId,
    date: new Date().toLocaleString(),
    image: dataUrl,
    coords: currentCoords
  };

  window.moleskineLibrary.unshift(noteEntry);
  localStorage.setItem("moleskine_saved_notes", JSON.stringify(window.moleskineLibrary));
  if(window.saveToFirebase) window.saveToFirebase('moleskine_saved_notes', window.moleskineLibrary);

  alert("¡Nota Moleskine guardada con éxito en tu biblioteca!");
  renderMoleskineLibrary();
}

function renderMoleskineLibrary() {
  const container = document.getElementById("savedNotesContainer");
  if(!container) return;
  
  if(!window.moleskineLibrary || window.moleskineLibrary.length === 0) {
    container.innerHTML = '<p style="color:var(--muted); font-size:0.85rem; italic;">Aún no tienes notas guardadas en tu biblioteca Moleskine.</p>';
    return;
  }

  let html = "";
  window.moleskineLibrary.forEach(note => {
    const linkedPlace = data.find(p => p.id === note.placeId);
    const placeName = linkedPlace ? `📍 ${linkedPlace.nombre}` : 'Nota General';
    const gpsText = note.coords ? ` | 📍 GPS: ${note.coords.lat.toFixed(4)}, ${note.coords.lng.toFixed(4)}` : '';

    html += `
      <div class="saved-note-card">
        <div>
          <strong style="color:#fff; font-size:0.95rem;">${escapeHtml(note.title)}</strong>
          <div style="font-size:0.78rem; color:var(--muted); margin-top:2px;">
            ${escapeHtml(placeName)} · ${escapeHtml(note.date)} ${gpsText}
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button onclick="loadSavedNote('${note.id}')" style="background:#2563eb; color:#fff; border:none; padding:5px 9px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:0.8rem;">📂 Cargar</button>
          <button onclick="deleteSavedNote('${note.id}')" style="background:#ef4444; color:#fff; border:none; padding:5px 9px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:0.8rem;">🗑️</button>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function loadSavedNote(id) {
  const note = window.moleskineLibrary.find(n => n.id === id);
  if(!note || !ctx) return;

  const img = new Image();
  img.onload = function() {
    saveCanvasState();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    document.getElementById("moleskineTitleInput").value = note.title;
    if(note.placeId) document.getElementById("moleskinePlaceSelect").value = note.placeId;
    if(note.coords) currentCoords = note.coords;
    alert(`Nota "${note.title}" cargada en el cuaderno.`);
  };
  img.src = note.image;
}

function deleteSavedNote(id) {
  window.moleskineLibrary = window.moleskineLibrary.filter(n => n.id !== id);
  localStorage.setItem("moleskine_saved_notes", JSON.stringify(window.moleskineLibrary));
  if(window.saveToFirebase) window.saveToFirebase('moleskine_saved_notes', window.moleskineLibrary);
  renderMoleskineLibrary();
}

function exportToCalendar() {
  const titleText = document.getElementById("moleskineTitleInput").value || "Nota Moleskine";
  const gpsText = currentCoords ? `GPS: https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lng}` : "";
  const title = encodeURIComponent("📓 Moleskine: " + titleText);
  const details = encodeURIComponent(`Nota guardada en el Cuaderno Moleskine.\n\n${gpsText}`);
  
  const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}`;
  window.open(gcalUrl, '_blank');
}
